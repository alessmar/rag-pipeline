x-rag: &rag
  build: .
  env_file: .env
  environment:
    RAG_REDIS_URL: redis://redis:6379/0
    PHOENIX_ENDPOINT: http://phoenix:6006/v1/traces
    RAG_TENANTS_FILE: /app/data/tenants.json
  volumes:
    - rag-data:/app/data
  depends_on: [redis]

services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    volumes: [redis-data:/data]
  app:
    <<: *rag
    ports: ["127.0.0.1:8501:8501"]
  api:
    <<: *rag
    command: ["uvicorn", "rag.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8010:8000"]  # the only way in to the queue; Redis itself is not published
  worker:
    <<: *rag
    command: ["rag", "worker"]
  phoenix:
    <<: *rag
    command: ["phoenix", "serve"]
    environment:
      PHOENIX_WORKING_DIR: /app/data/phoenix
      PHOENIX_HOST: 0.0.0.0  # listen outside the container; the published port is still localhost only
      PHOENIX_ENABLE_AUTH: "false"  # the port is published on localhost only
    ports: ["127.0.0.1:6006:6006"]

volumes:
  rag-data:
  redis-data:
